name: Android app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        working-directory: mobile
        run: npm ci

      - name: Generate the Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Slim the build
        working-directory: mobile/android
        run: |
          printf '\nreactNativeArchitectures=arm64-v8a\nandroid.enableBundleCompression=true\nandroid.enableShrinkResourcesInReleaseBuilds=true\n' >> gradle.properties

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the build
        working-directory: mobile/android
        run: cp app/build/outputs/apk/release/app-release.apk Leaf-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Leaf-Android
          path: mobile/android/Leaf-Android.apk
          if-no-files-found: error

      - name: Attach to the v1.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Leaf v1.0
          make_latest: true
          files: mobile/android/Leaf-Android.apk
