name: Android app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      # the static web app is bundled into the APK, so nothing is fetched at runtime
      - name: Build the app and copy it into the Android project
        run: npm run build:app

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the build
        run: cp android/app/build/outputs/apk/release/app-release.apk Leaf-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Leaf-Android
          path: Leaf-Android.apk
          if-no-files-found: error

      - name: Attach to the v1.0 release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Leaf v1.0
          files: Leaf-Android.apk
